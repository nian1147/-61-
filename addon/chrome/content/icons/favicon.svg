    <circle cx="14" cy="5" r="8" stroke-width="4.5" fill="#8B1A2B" stroke="#FFFFFF"/>
    <circle cx="14" cy="5" r="3" fill="#FFFFFF" stroke="none"/>
    <!-- 左耳管 -->
    <path d="M-14,-20 C-10,-28 -4,-30 2,-28"/>
    <!-- 右耳管 -->
    <path d="M-14,-20 C-18,-28 -24,-30 -28,-28"/>
